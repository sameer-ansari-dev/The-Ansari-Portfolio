<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal • Ansari Mohammed Sameer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-mark-lg">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1>Admin Control Portal</h1>
        <p>Authenticate to manage portfolio content, projects, skills & messages.</p>
      </div>

      {% if error %}
      <div class="login-alert">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/admin/login" method="POST" class="login-form">
        <div class="form-group">
          <label for="username">Admin Username</label>
          <div class="input-wrap">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Username (e.g. sameer)" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Secret Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="pwd-toggle" id="pwd-toggle" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="pwd-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="button button-primary login-btn">
          <span>Secure Sign In</span>
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>

      <div class="login-footer">
        <a href="/" class="back-link">
          <i class="fa-solid fa-arrow-left"></i> Return to Live Portfolio
        </a>
      </div>
    </div>
  </div>

  <script>
    const pwdInput = document.getElementById('password');
    const pwdToggle = document.getElementById('pwd-toggle');
    const pwdIcon = document.getElementById('pwd-icon');

    if (pwdToggle && pwdInput && pwdIcon) {
      pwdToggle.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      });
    }
  </script>
</body>
</html>
